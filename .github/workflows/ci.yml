name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run on demand from the Actions tab (e.g. to re-check main).
  workflow_dispatch:
  # Weekly, so a new Chrome stable (the integration job floats on it) or a new
  # advisory shows up here rather than as the next PR's failure.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# A newer push to a PR supersedes its running checks; every push to main keeps
# its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint + type-check + unit tests across a min and a current Elixir/OTP pair.
  # No Chrome here — these are the fast, deterministic checks (`mix ci` excludes
  # the integration tag).
  check:
    name: check (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    # A cold Dialyzer PLT build is the slow part; a stuck run shouldn't hold a
    # runner for GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15.8"
            otp: "26.2"
          - elixir: "1.19.7"
            otp: "28.5"
          - elixir: "1.20.5"
            otp: "29.1"
          # The production pair: Ubuntu 26.04 ships OTP 27 (see test/docker/).
          - elixir: "1.20.5"
            otp: "27.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Cache Dialyzer PLT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get
      - run: mix ci

      # Different advisory DB from `mix deps.audit`; hex.info records which Hex audited.
      - run: mix hex.info && mix hex.audit

  # Real-Chrome integration tests, on the current Elixir/OTP only.
  integration:
    name: integration (real Chrome)
    runs-on: ubuntu-24.04
    # The suite takes a few minutes; a hung Chrome must not hold the runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.1"
          elixir-version: "1.20.5"

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-integration-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-integration-

      - run: mix deps.get

      - name: Run integration tests
        env:
          CDP_EX_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: mix test --only integration

      # Every launched Chrome must be reaped, whatever the tests did; a test can
      # pass while leaving an OS process behind. Give a Chrome that is still
      # shutting down a few seconds, then fail on anything left with a cdp_ex
      # profile. Runs after a failed suite too, since that is when leaks happen.
      - name: No Chrome left behind
        if: ${{ always() }}
        run: |
          for _ in 1 2 3 4 5; do
            pgrep -f -- '--user-data-dir=[^ ]*cdp_ex-' > /dev/null || exit 0
            sleep 2
          done
          echo "::error::Chrome processes outlived the integration suite"
          pgrep -af -- '--user-data-dir=[^ ]*cdp_ex-'
          exit 1

  # Static security audit of these workflow files (script injection, token
  # permissions, dangerous triggers, action pinning). Fast; no Elixir/Chrome.
  # The action-pinning policy lives in .github/zizmor.yml.
  workflow-audit:
    name: workflow audit (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Pinned in a file Dependabot updates (pip ecosystem).
      - run: pip install -r .github/requirements/zizmor.txt

      - name: Audit workflows
        run: zizmor --offline .github/workflows/
